package:
  name: genome-sampler
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
    - python {{ python }}
    - setuptools
    - versioningit
    - wheel
  run:
    - python {{ python }}
    - vsearch
    - pandas
    - q2-types >={{ q2_types }}
    - q2templates >={{ q2templates }}
    - qiime2 >={{ qiime2 }}
    - pyvcf3
  build:
  - setuptools
  - versioningit
test:
  requires:
    - q2-types >={{ q2_types }}
    - qiime2 >={{ qiime2 }}
  imports:
    - genome_sampler
    - qiime2.plugins.genome_sampler
  commands:
    - py.test --pyargs genome_sampler
about:
  home: https://github.com/caporaso-lab/genome-sampler
  license: BSD-3-Clause
  license_family: BSD
